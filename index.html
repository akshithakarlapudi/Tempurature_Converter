<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Converter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="converter">
        <p class="eyebrow">SIMPLE UNIT CONVERTER</p>
        <h1>Temperature Converter</h1>
        <p class="intro">Convert temperatures between Celsius, Fahrenheit and Kelvin.</p>

        <form id="converterForm">
            <label for="temperature">Enter temperature</label>
            <input type="number" id="temperature" step="any" placeholder="e.g. 25" required>

            <label for="unit">Input unit</label>
            <select id="unit">
                <option value="C">Celsius (°C)</option>
                <option value="F">Fahrenheit (°F)</option>
                <option value="K">Kelvin (K)</option>
            </select>

            <button type="submit">Convert temperature</button>
            <p id="error" class="error" role="alert"></p>
        </form>

        <section id="results" class="results" aria-live="polite" hidden>
            <h2>Converted values</h2>
            <div class="result-grid">
                <article class="result-card">
                    <span>Celsius</span>
                    <strong id="celsius">—</strong>
                </article>
                <article class="result-card">
                    <span>Fahrenheit</span>
                    <strong id="fahrenheit">—</strong>
                </article>
                <article class="result-card">
                    <span>Kelvin</span>
                    <strong id="kelvin">—</strong>
                </article>
            </div>
        </section>

        <p class="note">Note: Temperatures below absolute zero cannot exist.</p>
    </main>
    <script src="script.js"></script>
</body>
</html>
